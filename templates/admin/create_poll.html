{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="mb-0">创建新投票</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">标题</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">描述（可选）</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="end_date" class="form-label">截止日期时间（可选）</label>
                <input type="datetime-local" class="form-control" id="end_date" name="end_date">
            </div>

            <div class="mb-3">
                <label class="form-label">选项</label>
                <div id="options-container">
                    <div class="input-group mb-2">
                        <input type="text" class="form-control" name="options" required>
                        <button type="button" class="btn btn-danger" onclick="removeOption(this)">删除</button>
                    </div>
                    <div class="input-group mb-2">
                        <input type="text" class="form-control" name="options" required>
                        <button type="button" class="btn btn-danger" onclick="removeOption(this)">删除</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="addOption()">添加选项</button>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">创建投票</button>
                <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">返回</a>
            </div>
        </form>
    </div>
</div>

<script>
function addOption() {
    const container = document.getElementById('options-container');
    const newOption = document.createElement('div');
    newOption.className = 'input-group mb-2';
    newOption.innerHTML = `
        <input type="text" class="form-control" name="options" required>
        <button type="button" class="btn btn-danger" onclick="removeOption(this)">删除</button>
    `;
    container.appendChild(newOption);
}

function removeOption(button) {
    const container = document.getElementById('options-container');
    if (container.children.length > 2) {
        button.parentElement.remove();
    } else {
        alert('至少需要两个选项！');
    }
}
</script>
{% endblock %}
